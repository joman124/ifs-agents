name: reminders

# A backup tick for the daily reminders. The main clock is the 24 daily
# Vercel crons in vercel.json: GitHub's hourly schedule ran only about four
# times a day. api/push-remind.js never sends a device the same reminder
# twice, so this running as well is harmless.
on:
  schedule:
    - cron: "7 * * * *" # off the top of the hour, when GitHub's queue is busiest
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      # a block scalar: the ": " in the header breaks a plain YAML value
      - run: |
          curl -fsS -H "Authorization: Bearer $CRON_SECRET" https://ifs-agents.vercel.app/api/push-remind
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
